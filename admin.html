<!DOCTYPE html>
<html lang="ml" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

  <!-- Icons -->
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <!-- Fonts & Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Malayalam:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=20261123_v45">

  <style>
    body {
      background: #04090e;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: var(--font-sans, "Inter", "Noto Sans Malayalam", sans-serif);
      margin: 0;
      padding: 0;
    }
    .admin-standalone-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    .admin-hero-card {
      background: #09131c;
      border: 1.5px solid rgba(245, 158, 11, 0.35);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(245, 158, 11, 0.12);
    }
    .admin-hero-shield {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 16px;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }
    .admin-hero-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 6px;
    }
    .admin-hero-sub {
      font-size: 0.85rem;
      color: #94a3b8;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    .admin-open-btn {
      width: 100%;
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: #ffffff;
      border: 1px solid #10b981;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
    }
    .admin-open-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(5, 150, 105, 0.4);
    }
    .admin-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      color: #94a3b8;
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .admin-back-link:hover {
      color: #f59e0b;
    }
  </style>
</head>
<body>
  <div class="admin-standalone-wrap">
    <div class="admin-hero-card">
      <div class="admin-hero-shield" aria-hidden="true">🛡️</div>
      <h1 class="admin-hero-title">അഡ്മിൻ പോർട്ടൽ</h1>
      <p class="admin-hero-sub">
        KSA Malayali Hub · D&amp;J Techies (+44 7460 646263)<br>
        സിസ്റ്റം അനലിറ്റിക്സ്, ആക്റ്റിവിറ്റി ലോഗുകൾ &amp; മോണിറ്ററിംഗ് കൺസോൾ
      </p>

      <button type="button" class="admin-open-btn" id="btn-trigger-admin-portal">
        <span>🛡️ അഡ്മിൻ കൺസോൾ തുറക്കുക</span>
        <span>➔</span>
      </button>

      <div>
        <a href="/" class="admin-back-link">
          <span>← പബ്ലിക് പോർട്ടലിലേക്ക് മടങ്ങുക (Return to Home)</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="/js/supabase.js?v=20261123_v45"></script>
  <script src="/js/admin.js?v=20261123_v45"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Auto open admin modal on dedicated /admin route
      setTimeout(() => {
        if (window.HubAdmin) {
          window.HubAdmin.open();
        }
      }, 200);

      const triggerBtn = document.getElementById("btn-trigger-admin-portal");
      if (triggerBtn) {
        triggerBtn.addEventListener("click", () => {
          if (window.HubAdmin) window.HubAdmin.open();
        });
      }
    });
  </script>
</body>
</html>
