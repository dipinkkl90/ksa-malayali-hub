  <rect x="20" y="280" width="260" height="95" rx="12" fill="rgba(255, 255, 255, 0.95)"/>
  <text x="35" y="306" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#00843D">🌾 Basmati Rice 5kg</text>
  <text x="220" y="306" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" fill="#d32f2f">SAR 28.99</text>
  <line x1="35" y1="316" x2="265" y2="316" stroke="#eee" stroke-width="1"/>
  <text x="35" y="338" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#00843D">🌻 Sunflower Oil 1.5L</text>
  <text x="220" y="338" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" fill="#d32f2f">SAR 10.99</text>
  <line x1="35" y1="348" x2="265" y2="348" stroke="#eee" stroke-width="1"/>
  <text x="35" y="366" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#333">🥔 Fresh Potato 2kg · SAR 1.95</text>
