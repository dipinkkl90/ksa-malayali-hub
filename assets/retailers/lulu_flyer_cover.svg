  <!-- Big 70% Badge -->
  <circle cx="150" cy="205" r="54" fill="url(#goldLulu)" stroke="#ffffff" stroke-width="4"/>
  <text x="150" y="196" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" fill="#9a0007" text-anchor="middle">UP TO</text>
  <text x="150" y="232" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="38" fill="#9a0007" text-anchor="middle">70%</text>
  <text x="150" y="248" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#9a0007" text-anchor="middle">OFF · خصم</text>

