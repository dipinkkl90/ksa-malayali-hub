  </defs>
  <rect width="100%" height="100%" fill="url(#bgLulu)"/>
  
  <!-- Header Banner -->
  <rect x="0" y="0" width="300" height="60" fill="#ffffff"/>
  <circle cx="35" cy="30" r="18" fill="#00843D" opacity="0.15"/>
  <path d="M26 30 C26 22, 40 22, 44 28 C46 34, 36 40, 28 38 Z" fill="#00843D"/>
  <path d="M32 24 C36 20, 46 24, 44 32" stroke="#E31B23" stroke-width="3" fill="none"/>
  <text x="60" y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="24" fill="#00843D">LuLu</text>
  <text x="120" y="36" font-family="'Noto Sans Arabic', Arial, sans-serif" font-weight="800" font-size="18" fill="#E31B23">لولو</text>
  <rect x="200" y="14" width="85" height="32" rx="16" fill="#00843D"/>
  <text x="242" y="34" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">KSA DEALS</text>

  <!-- Big Offer Text -->
  <text x="150" y="110" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">SUPER FRIDAY</text>
