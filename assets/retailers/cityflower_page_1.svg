  <!-- Footer Bar -->
  <rect x="0" y="375" width="300" height="25" fill="#0f172a"/>
  <text x="150" y="391" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#94a3b8" text-anchor="middle">OFFICIAL DIGITAL PROMOTIONS · PAGE 1 OF 2</text>
