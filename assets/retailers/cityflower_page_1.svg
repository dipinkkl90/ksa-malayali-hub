      <text x="224" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">SAR 19.00</text>
      <text x="224" y="47" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="8" fill="#fef08a" text-anchor="middle">51% OFF</text>
