  <text x="14" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#008752">Panda</text>
  <text x="75" y="32" font-family="'Noto Sans Arabic', Arial, sans-serif" font-weight="800" font-size="16" fill="#e11d48">بنده</text>
  
  <!-- Page Number Pill -->
