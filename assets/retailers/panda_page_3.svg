  <text x="248" y="30" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#38bdf8" text-anchor="middle">PAGE 3/4</text>
  
  <!-- Department Banner -->
  <rect x="14" y="62" width="272" height="68" rx="12" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <rect x="24" y="72" width="90" height="18" rx="9" fill="url(#goldBar)"/>
  <text x="69" y="84" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="9" fill="#0f172a" text-anchor="middle">DAIRY FEST</text>
  
  <text x="24" y="105" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff">Dairy, Cheese & Delicatessen</text>
  <text x="24" y="122" font-family="'Noto Sans Arabic', Arial, sans-serif" font-weight="700" font-size="12" fill="rgba(255,255,255,0.9)">الألبان والأجبان والمأكولات الشهية</text>
  
  <!-- Products Section -->
  
    <!-- Product Item 1 -->
    <g transform="translate(14, 145)">
      <rect width="272" height="68" rx="10" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.12))"/>
      
      <!-- Icon/Tag Box -->
      <rect x="8" y="8" width="52" height="52" rx="8" fill="#0284c7" opacity="0.12"/>
      <text x="34" y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" text-anchor="middle">🥛</text>
      
      <!-- Product Details -->
      <text x="68" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#1e293b">Nadec Fresh Milk 2.9L</text>
      <text x="68" y="40" font-family="'Noto Sans Arabic', Arial, sans-serif" font-size="10" fill="#64748b">حليب نادك طازج ٢.٩ لتر</text>
      
