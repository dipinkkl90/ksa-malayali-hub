      <rect x="8" y="8" width="52" height="52" rx="8" fill="#0369a1" opacity="0.12"/>
      <text x="34" y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" text-anchor="middle">☕</text>
      
      <!-- Product Details -->
      <text x="68" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#1e293b">Nescafe Classic Coffee 200</text>
      <text x="68" y="40" font-family="'Noto Sans Arabic', Arial, sans-serif" font-size="10" fill="#64748b">قهوة نسكافيه كلاسيك ٢٠٠ </text>
      
      <!-- Old Price -->
      <text x="68" y="56" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" fill="#94a3b8" text-decoration="line-through">SAR 31.50</text>
      
      <!-- Offer Price Badge -->
      <rect x="186" y="14" width="76" height="40" rx="8" fill="#e11d48"/>
      <text x="224" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">SAR 19.95</text>
      <text x="224" y="47" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="8" fill="#fef08a" text-anchor="middle">37% OFF</text>
