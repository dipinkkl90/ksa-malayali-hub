      <rect x="186" y="14" width="76" height="40" rx="8" fill="#e11d48"/>
      <text x="224" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">SAR 8.95</text>
      <text x="224" y="47" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="8" fill="#fef08a" text-anchor="middle">44% OFF</text>
    </g>
  
  <!-- Footer Bar -->
  <rect x="0" y="375" width="300" height="25" fill="#0f172a"/>
  <text x="150" y="391" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#94a3b8" text-anchor="middle">OFFICIAL DIGITAL PROMOTIONS · PAGE 1 OF 3</text>
