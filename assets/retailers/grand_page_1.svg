      <rect x="8" y="8" width="52" height="52" rx="8" fill="#b91c1c" opacity="0.12"/>
      <text x="34" y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" text-anchor="middle">🍗</text>
      
      <!-- Product Details -->
      <text x="68" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#1e293b">Amana Frozen Chicken 10x90</text>
      <text x="68" y="40" font-family="'Noto Sans Arabic', Arial, sans-serif" font-size="10" fill="#64748b">دجاج أمانة مجمد ١٠ × ٩٠٠</text>
      
      <!-- Old Price -->
      <text x="68" y="56" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" fill="#94a3b8" text-decoration="line-through">SAR 165.00</text>
      
