  <rect x="20" y="280" width="260" height="95" rx="12" fill="rgba(255, 255, 255, 0.95)"/>
  <text x="35" y="306" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#0b3c78">🍗 Fresh Chicken 1kg</text>
  <text x="220" y="306" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" fill="#E31E24">SAR 9.99</text>
