  </defs>
  <rect width="100%" height="100%" fill="url(#bgNesto)"/>

  <!-- Header -->
  <rect x="0" y="0" width="300" height="60" fill="#ffffff"/>
  <rect x="20" y="10" width="45" height="40" rx="8" fill="#E31E24"/>
  <text x="42" y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">N</text>
  <text x="75" y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="24" fill="#0b3c78">nesto</text>
  <text x="145" y="36" font-family="'Noto Sans Arabic', Arial, sans-serif" font-weight="800" font-size="18" fill="#E31E24">نيستو</text>
  <rect x="200" y="14" width="85" height="32" rx="16" fill="#E31E24"/>
  <text x="242" y="34" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">HALF PRICE</text>

  <!-- Big Title -->
  <text x="150" y="115" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#F8B133" text-anchor="middle">MIDNIGHT FIESTA</text>
