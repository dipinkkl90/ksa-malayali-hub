  <text x="35" y="338" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#0b3c78">🐟 Malabar Ayala Fish</text>
  <text x="220" y="338" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" fill="#E31E24">SAR 6.50</text>
  <line x1="35" y1="348" x2="265" y2="348" stroke="#eee" stroke-width="1"/>
  <text x="35" y="366" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#333">🥛 Almarai Milk 2L · SAR 8.50</text>
  <text x="260" y="366" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#0b3c78" text-anchor="end">32+ Pages ➔</text>
