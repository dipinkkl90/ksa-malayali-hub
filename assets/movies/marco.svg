<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="marcoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0404"/>
      <stop offset="45%" stop-color="#3b0808"/>
      <stop offset="85%" stop-color="#120202"/>
      <stop offset="100%" stop-color="#050000"/>
    </linearGradient>
    <radialGradient id="bloodGlow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#991b1b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#050000" stop-opacity="0"/>
    </radialGradient>
    <filter id="crimsonGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#marcoBg)"/>
  <circle cx="300" cy="380" r="210" fill="url(#bloodGlow)"/>

  <!-- High-octane Action Silhouette (Marco with Twin Blades & Coat) -->
  <g transform="translate(190, 210) scale(1.05)" fill="#050000">
    <path d="M40,160 L110,120 L180,160 L210,340 L10,340 Z"/>
    <circle cx="110" cy="70" r="26"/>
    <!-- Bearded profile with sunglasses -->
    <path d="M90,75 Q110,65 130,75 L125,95 Q110,115 95,95 Z" fill="#ef4444" opacity="0.7"/>
    <!-- Twin Battle Axes / Daggers in Hands -->
    <line x1="20" y1="180" x2="10" y2="300" stroke="#f87171" stroke-width="7" stroke-linecap="round" filter="url(#crimsonGlow)"/>
    <line x1="200" y1="180" x2="210" y2="300" stroke="#f87171" stroke-width="7" stroke-linecap="round" filter="url(#crimsonGlow)"/>
  </g>

  <!-- Bottom Vignette -->
  <rect y="600" width="600" height="300" fill="#050000"/>

  <!-- Badges Top -->
  <g transform="translate(30, 40)">
    <rect width="180" height="32" rx="16" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="21" fill="#ef4444" font-family="'Montserrat', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⚔️ ULTRA HIGH ACTION</text>
  </g>
  <g transform="translate(450, 40)">
    <rect width="120" height="32" rx="16" fill="#b91c1c"/>
    <text x="60" y="21" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⭐ 8.5 / 10</text>
  </g>

  <!-- Title Block -->
  <text x="300" y="700" fill="#ef4444" font-family="'Montserrat', sans-serif" font-size="62" font-weight="900" text-anchor="middle" filter="url(#crimsonGlow)" letter-spacing="14">MARCO</text>
  <text x="300" y="740" fill="#fee2e2" font-family="'Manjari', 'Anek Malayalam', sans-serif" font-size="34" font-weight="900" text-anchor="middle">മാർക്കോ</text>

  <!-- Subtitle & Cast -->
  <text x="300" y="780" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">HANEEF ADENI FILM · MUSIC: RAVI BASRUR</text>
  <text x="300" y="810" fill="#cbd5e1" font-family="'Montserrat', sans-serif" font-size="14" text-anchor="middle">UNNI MUKUNDAN · JAGADISH · SIDDIQUE · ABHIMANYU THILAKAN</text>

  <!-- Specs -->
  <line x1="60" y1="835" x2="540" y2="835" stroke="#ef4444" stroke-width="1" opacity="0.3"/>
  <text x="300" y="865" fill="#991b1b" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">A 18+ · 2H 30M · VIOLENT ACTION THRILLER · MALAYALAM (ENG SUBS)</text>
</svg>