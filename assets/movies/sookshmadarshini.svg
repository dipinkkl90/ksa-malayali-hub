<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="sookshmaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071b26"/>
      <stop offset="45%" stop-color="#0f384c"/>
      <stop offset="85%" stop-color="#061822"/>
      <stop offset="100%" stop-color="#020a0f"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx="0.5" cy="0.42" r="0.45">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#071b26" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowYellow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#sookshmaBg)"/>
  <circle cx="300" cy="380" r="220" fill="url(#lensGlow)"/>

  <!-- Giant Magnifying Glass (Sookshmadarshini / Microscope) Silhouette -->
  <g transform="translate(180, 200) scale(1.05)">
    <!-- Lens Ring -->
    <circle cx="110" cy="120" r="95" fill="none" stroke="#facc15" stroke-width="12" filter="url(#glowYellow)"/>
    <circle cx="110" cy="120" r="85" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <!-- Handle -->
    <path d="M180,185 L260,265" stroke="#facc15" stroke-width="22" stroke-linecap="round"/>
    <path d="M185,190 L255,260" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
    <!-- Curious Eyes peering through lens (Nazriya & Basil) -->
    <circle cx="85" cy="115" r="18" fill="#ffffff"/>
    <circle cx="88" cy="115" r="9" fill="#0f172a"/>
    <circle cx="135" cy="115" r="18" fill="#ffffff"/>
    <circle cx="138" cy="115" r="9" fill="#0f172a"/>
  </g>

  <!-- Bottom Dark Vignette -->
  <rect y="580" width="600" height="320" fill="#020a0f"/>

  <!-- Badges Top -->
  <g transform="translate(30, 40)">
    <rect width="210" height="32" rx="16" fill="#facc15"/>
    <text x="105" y="21" fill="#000000" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900" text-anchor="middle">🔥 LATEST NOV BLOCKBUSTER</text>
  </g>
  <g transform="translate(450, 40)">
    <rect width="120" height="32" rx="16" fill="#15803d"/>
    <text x="60" y="21" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⭐ 8.7 / 10</text>
  </g>

  <!-- Movie Title Block -->
  <text x="300" y="700" fill="#facc15" font-family="'Manjari', 'Anek Malayalam', sans-serif" font-size="52" font-weight="900" text-anchor="middle" filter="url(#glowYellow)" letter-spacing="2">സൂക്ഷ്മദർശിനി</text>
  <text x="300" y="745" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="6">SOOKSHMADARSHINI</text>

  <!-- Subtitle & Cast -->
  <text x="300" y="780" fill="#38bdf8" font-family="'Montserrat', sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">A FILM BY M.C. JITHIN · MUSIC: CHRISTO XAVIER</text>
  <text x="300" y="810" fill="#cbd5e1" font-family="'Montserrat', sans-serif" font-size="14" text-anchor="middle">BASIL JOSEPH · NAZRIYA NAZIM · DEEPAK PARAMBOL</text>

  <!-- Specs -->
  <line x1="60" y1="835" x2="540" y2="835" stroke="#facc15" stroke-width="1" opacity="0.4"/>
  <text x="300" y="865" fill="#94a3b8" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">U · 2H 19M · COMEDY MYSTERY THRILLER · HOUSEFULL IN KSA</text>
</svg>