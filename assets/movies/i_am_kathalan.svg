<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02140c"/>
      <stop offset="45%" stop-color="#06331e"/>
      <stop offset="85%" stop-color="#021a0e"/>
      <stop offset="100%" stop-color="#010a05"/>
    </linearGradient>
    <radialGradient id="matrixGlow" cx="0.5" cy="0.4" r="0.45">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#15803d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#010a05" stop-opacity="0"/>
    </radialGradient>
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#cyberBg)"/>
  <circle cx="300" cy="380" r="210" fill="url(#matrixGlow)"/>

  <!-- Matrix / Cyber Code Grid -->
  <g fill="#22c55e" opacity="0.15" font-family="monospace" font-size="14">
    <text x="40" y="100">01011001 01101111</text>
    <text x="40" y="140">11001010 10100101</text>
    <text x="400" y="120">SYSTEM_OVERRIDE</text>
    <text x="380" y="160">HASH_KEY_AUTH_OK</text>
  </g>

  <!-- Young Hacker Hoodie & Laptop Silhouette (Naslen) -->
  <g transform="translate(190, 210) scale(1.05)" fill="#010a05">
    <!-- Hoodie silhouette -->
    <path d="M40,160 Q105,95 170,160 L185,290 L25,290 Z"/>
    <circle cx="105" cy="85" r="28"/>
    <!-- Glowing Laptop Screen light on face -->
    <polygon points="60,260 150,260 170,290 40,290" fill="#22c55e" filter="url(#greenGlow)"/>
  </g>

  <!-- Bottom Vignette -->
  <rect y="580" width="600" height="320" fill="#010a05"/>

  <!-- Badges Top -->
  <g transform="translate(30, 40)">
    <rect width="190" height="32" rx="16" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="1.5"/>
    <text x="95" y="21" fill="#22c55e" font-family="'Montserrat', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">💻 CYBER CRIME THRILLER</text>
  </g>
  <g transform="translate(450, 40)">
    <rect width="120" height="32" rx="16" fill="#15803d"/>
    <text x="60" y="21" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⭐ 8.2 / 10</text>
  </g>

  <!-- Title Block -->
  <text x="300" y="700" fill="#22c55e" font-family="'Manjari', 'Anek Malayalam', sans-serif" font-size="48" font-weight="900" text-anchor="middle" filter="url(#greenGlow)" letter-spacing="2">ഐ ആം കാതലൻ</text>
  <text x="300" y="745" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="8">I AM KATHALAN</text>

  <!-- Subtitle & Cast -->
  <text x="300" y="780" fill="#86efac" font-family="'Montserrat', sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">A GIRISH A.D. FILM · MUSIC: SIDHARTHA PRADEEP</text>
  <text x="300" y="810" fill="#cbd5e1" font-family="'Montserrat', sans-serif" font-size="14" text-anchor="middle">NASLEN · ANISHMA ANILKUMAR · LIJOMOL JOSE</text>

  <!-- Specs -->
  <line x1="60" y1="835" x2="540" y2="835" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
  <text x="300" y="865" fill="#94a3b8" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">UA 13+ · 2H 16M · TECH HACKING THRILLER · VOX &amp; MUVI</text>
</svg>