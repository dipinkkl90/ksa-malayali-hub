<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bougainBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18040b"/>
      <stop offset="45%" stop-color="#3b0918"/>
      <stop offset="85%" stop-color="#160309"/>
      <stop offset="100%" stop-color="#080104"/>
    </linearGradient>
    <radialGradient id="redBloom" cx="0.5" cy="0.4" r="0.45">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#be123c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#080104" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomGlow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#bougainBg)"/>
  <circle cx="300" cy="380" r="210" fill="url(#redBloom)"/>

  <!-- Stylized Bougainvillea Branches & Flowers -->
  <g fill="#f43f5e" opacity="0.75" filter="url(#bloomGlow)">
    <circle cx="160" cy="240" r="24"/><circle cx="180" cy="225" r="28"/><circle cx="145" cy="260" r="22"/>
    <circle cx="430" cy="260" r="26"/><circle cx="455" cy="240" r="30"/><circle cx="415" cy="280" r="24"/>
    <circle cx="300" cy="180" r="32"/><circle cx="325" cy="165" r="28"/>
  </g>

  <!-- Amal Neerad Noir Silhouettes (Kunchacko Boban & Fahadh) -->
  <g transform="translate(180, 240) scale(1.05)" fill="#080104">
    <path d="M40,160 Q80,100 120,160 L130,280 L30,280 Z"/>
    <circle cx="80" cy="90" r="26"/>
    <!-- Detective Coat Profile -->
    <path d="M140,160 Q180,110 220,160 L230,280 L130,280 Z"/>
    <circle cx="180" cy="95" r="25"/>
  </g>

  <!-- Bottom Vignette -->
  <rect y="580" width="600" height="320" fill="#080104"/>

  <!-- Badges Top -->
  <g transform="translate(30, 40)">
    <rect width="190" height="32" rx="16" fill="rgba(244,63,94,0.2)" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="95" y="21" fill="#f43f5e" font-family="'Montserrat', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🎬 AMAL NEERAD THRILLER</text>
  </g>
  <g transform="translate(450, 40)">
    <rect width="120" height="32" rx="16" fill="#be123c"/>
    <text x="60" y="21" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⭐ 8.3 / 10</text>
  </g>

  <!-- Title Block -->
  <text x="300" y="700" fill="#f43f5e" font-family="'Manjari', 'Anek Malayalam', sans-serif" font-size="52" font-weight="900" text-anchor="middle" filter="url(#bloomGlow)" letter-spacing="2">ബൊഗയ്ൻവില്ല</text>
  <text x="300" y="745" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="8">BOUGAINVILLEA</text>

  <!-- Subtitle & Cast -->
  <text x="300" y="780" fill="#fb7185" font-family="'Montserrat', sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">AN AMAL NEERAD FILM · MUSIC: SUSHIN SHYAM</text>
  <text x="300" y="810" fill="#cbd5e1" font-family="'Montserrat', sans-serif" font-size="14" text-anchor="middle">KUNCHACKO BOBAN · FAHADH FAASIL · JYOTHIRMAYI</text>

  <!-- Specs -->
  <line x1="60" y1="835" x2="540" y2="835" stroke="#f43f5e" stroke-width="1" opacity="0.3"/>
  <text x="300" y="865" fill="#94a3b8" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">UA 16+ · 2H 19M · PSYCHOLOGICAL MYSTERY THRILLER</text>
</svg>