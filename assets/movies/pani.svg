<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="paniBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1017"/>
      <stop offset="45%" stop-color="#16293a"/>
      <stop offset="85%" stop-color="#0c1824"/>
      <stop offset="100%" stop-color="#04080d"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="0.5" cy="0.4" r="0.45">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#04080d" stop-opacity="0"/>
    </radialGradient>
    <filter id="flameGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#paniBg)"/>
  <circle cx="300" cy="380" r="210" fill="url(#fireGlow)"/>

  <!-- Joju George Heavyweight Silhouette (Pani Giri) -->
  <g transform="translate(195, 200) scale(1.05)" fill="#04080d">
    <!-- Massive broad shoulders & jacket -->
    <path d="M20,150 L100,105 L180,150 L200,320 L0,320 Z"/>
    <circle cx="100" cy="65" r="30"/>
    <!-- Intense Beard Profile -->
    <path d="M70,70 Q100,115 130,70 Z" fill="#f97316" opacity="0.3"/>
  </g>

  <!-- Bottom Vignette -->
  <rect y="580" width="600" height="320" fill="#04080d"/>

  <!-- Badges Top -->
  <g transform="translate(30, 40)">
    <rect width="180" height="32" rx="16" fill="rgba(249,115,22,0.2)" stroke="#f97316" stroke-width="1.5"/>
    <text x="90" y="21" fill="#f97316" font-family="'Montserrat', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">💥 MASS ACTION HIT</text>
  </g>
  <g transform="translate(450, 40)">
    <rect width="120" height="32" rx="16" fill="#ea580c"/>
    <text x="60" y="21" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⭐ 8.4 / 10</text>
  </g>

  <!-- Title Block -->
  <text x="300" y="695" fill="#f97316" font-family="'Manjari', 'Anek Malayalam', sans-serif" font-size="64" font-weight="900" text-anchor="middle" filter="url(#flameGlow)" letter-spacing="4">പണി</text>
  <text x="300" y="740" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="36" font-weight="900" text-anchor="middle" letter-spacing="10">PANI</text>

  <!-- Subtitle & Cast -->
  <text x="300" y="775" fill="#fdba74" font-family="'Montserrat', sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">WRITTEN &amp; DIRECTED BY JOJU GEORGE</text>
  <text x="300" y="805" fill="#cbd5e1" font-family="'Montserrat', sans-serif" font-size="14" text-anchor="middle">JOJU GEORGE · ABINAYA · SAGAR SURYA · JUNAIS</text>

  <!-- Specs -->
  <line x1="60" y1="830" x2="540" y2="830" stroke="#f97316" stroke-width="1" opacity="0.3"/>
  <text x="300" y="860" fill="#94a3b8" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">A 18+ · 2H 25M · HARDCORE GANGSTER ACTION THRILLER</text>
</svg>