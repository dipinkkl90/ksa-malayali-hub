<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="anandBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="searchLight" cx="0.5" cy="0.4" r="0.45">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <filter id="blueGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#anandBg)"/>
  <circle cx="300" cy="380" r="210" fill="url(#searchLight)"/>

  <!-- Police / Investigation Forensic Search Silhouette -->
  <g transform="translate(180, 220) scale(1.05)" fill="#030712">
    <!-- Cop / Investigator with Torch Silhouette -->
    <path d="M40,150 L110,105 L180,150 L195,290 L25,290 Z"/>
    <circle cx="110" cy="65" r="26"/>
    <!-- Police Cap Visor -->
    <path d="M90,50 L140,50 L130,60 L100,60 Z" fill="#60a5fa"/>
    <!-- Investigative Torch Beam -->
    <polygon points="170,180 320,120 320,240" fill="#60a5fa" opacity="0.3" filter="url(#blueGlow)"/>
  </g>

  <!-- Bottom Vignette -->
  <rect y="580" width="600" height="320" fill="#030712"/>

  <!-- Badges Top -->
  <g transform="translate(30, 40)">
    <rect width="190" height="32" rx="16" fill="rgba(96,165,250,0.2)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="95" y="21" fill="#60a5fa" font-family="'Montserrat', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🔍 CRIME INVESTIGATION</text>
  </g>
  <g transform="translate(450, 40)">
    <rect width="120" height="32" rx="16" fill="#2563eb"/>
    <text x="60" y="21" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⭐ 8.1 / 10</text>
  </g>

  <!-- Title Block -->
  <text x="300" y="700" fill="#60a5fa" font-family="'Manjari', 'Anek Malayalam', sans-serif" font-size="48" font-weight="900" text-anchor="middle" filter="url(#blueGlow)" letter-spacing="2">ആനന്ദ് ശ്രീബാല</text>
  <text x="300" y="745" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="8">ANAND SREEBALA</text>

  <!-- Subtitle & Cast -->
  <text x="300" y="780" fill="#93c5fd" font-family="'Montserrat', sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">DIRECTED BY VISHNU VINAY · WRITTEN BY ABHILASH PILLAI</text>
  <text x="300" y="810" fill="#cbd5e1" font-family="'Montserrat', sans-serif" font-size="14" text-anchor="middle">ARJUN ASHOKAN · APARNA DAS · SANGHITA SHENOY · SAIJU KURUP</text>

  <!-- Specs -->
  <line x1="60" y1="835" x2="540" y2="835" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <text x="300" y="865" fill="#94a3b8" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">UA 13+ · 2H 18M · REAL-LIFE LAW ENFORCEMENT THRILLER</text>
</svg>