<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="mummyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#170624"/>
      <stop offset="45%" stop-color="#3b1159"/>
      <stop offset="85%" stop-color="#1c072c"/>
      <stop offset="100%" stop-color="#08020d"/>
    </linearGradient>
    <radialGradient id="spookyGlow" cx="0.5" cy="0.4" r="0.45">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#7e22ce" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#08020d" stop-opacity="0"/>
    </radialGradient>
    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#mummyBg)"/>
  <circle cx="300" cy="380" r="210" fill="url(#spookyGlow)"/>

  <!-- Spooky Mummy Ghost & Comedy Bridegroom Silhouette -->
  <g transform="translate(180, 210) scale(1.05)" fill="#08020d">
    <!-- Groom (Sharafudheen) in suit with terrified funny stance -->
    <path d="M40,160 L95,110 L150,160 L160,290 L30,290 Z"/>
    <circle cx="95" cy="70" r="26"/>
    <!-- Floating Spooky Ghost Silhouette with glowing white wraps -->
    <path d="M160,110 Q210,60 260,110 Q280,180 240,240 Q180,290 160,200 Z" fill="#e9d5ff" opacity="0.85" filter="url(#purpleGlow)"/>
    <circle cx="210" cy="110" r="8" fill="#7e22ce"/>
    <circle cx="230" cy="110" r="8" fill="#7e22ce"/>
  </g>

  <!-- Bottom Vignette -->
  <rect y="580" width="600" height="320" fill="#08020d"/>

  <!-- Badges Top -->
  <g transform="translate(30, 40)">
    <rect width="180" height="32" rx="16" fill="rgba(192,132,252,0.2)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="90" y="21" fill="#c084fc" font-family="'Montserrat', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">👻 COMEDY HORROR RIDE</text>
  </g>
  <g transform="translate(450, 40)">
    <rect width="120" height="32" rx="16" fill="#7e22ce"/>
    <text x="60" y="21" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⭐ 8.0 / 10</text>
  </g>

  <!-- Title Block -->
  <text x="300" y="700" fill="#c084fc" font-family="'Manjari', 'Anek Malayalam', sans-serif" font-size="52" font-weight="900" text-anchor="middle" filter="url(#purpleGlow)" letter-spacing="2">ഹലോ മമ്മി</text>
  <text x="300" y="745" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="30" font-weight="900" text-anchor="middle" letter-spacing="8">HELLO MUMMY</text>

  <!-- Subtitle & Cast -->
  <text x="300" y="780" fill="#d8b4fe" font-family="'Montserrat', sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">A VAISHAKH ELANS FILM · MUSIC: JAKES BEJOY</text>
  <text x="300" y="810" fill="#cbd5e1" font-family="'Montserrat', sans-serif" font-size="14" text-anchor="middle">SHARAFUDHEEN · AISHWARYA LEKSHMI · SUNNY HINDUJA · AJU</text>

  <!-- Specs -->
  <line x1="60" y1="835" x2="540" y2="835" stroke="#c084fc" stroke-width="1" opacity="0.3"/>
  <text x="300" y="865" fill="#94a3b8" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">UA 13+ · 2H 12M · FANTASY COMEDY HORROR · NOV RELEASE</text>
</svg>