<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="caveBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#021019"/>
      <stop offset="40%" stop-color="#082b38"/>
      <stop offset="80%" stop-color="#04141c"/>
      <stop offset="100%" stop-color="#01070a"/>
    </linearGradient>
    <linearGradient id="lightBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <filter id="torchGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#caveBg)"/>

  <!-- Subterranean Rock / Guna Cave Walls -->
  <path d="M0,0 L180,0 L120,380 L0,550 Z" fill="#04121a"/>
  <path d="M600,0 L420,0 L490,420 L600,600 Z" fill="#030e14"/>

  <!-- Light Beam down into the deep cave -->
  <polygon points="260,0 340,0 480,650 120,650" fill="url(#lightBeam)"/>

  <!-- The Friends Holding Hands Silhouette -->
  <g transform="translate(130, 460) scale(0.9)" fill="#02080d">
    <!-- Group of 6 Boys at the cliff edge reaching down with ropes -->
    <path d="M30,120 Q50,70 70,120 L80,180 L20,180 Z"/>
    <circle cx="50" cy="65" r="16"/>

    <path d="M90,110 Q120,50 150,110 L160,180 L80,180 Z"/>
    <circle cx="120" cy="45" r="18"/>

    <!-- Reaching boy with flashlight/torch -->
    <path d="M160,115 Q200,60 230,115 L240,180 L150,180 Z"/>
    <circle cx="195" cy="55" r="17"/>
    <!-- Flashlight Beam -->
    <line x1="215" y1="95" x2="280" y2="160" stroke="#fef08a" stroke-width="4" filter="url(#torchGlow)"/>

    <path d="M240,110 Q270,50 300,110 L310,180 L230,180 Z"/>
    <circle cx="270" cy="48" r="17"/>

    <path d="M310,120 Q340,65 370,120 L380,180 L300,180 Z"/>
    <circle cx="340" cy="60" r="16"/>

    <!-- Rescue Rope Dropping Down into Darkness -->
    <line x1="200" y1="120" x2="200" y2="300" stroke="#facc15" stroke-width="3" stroke-dasharray="6,4"/>
  </g>

  <!-- Bottom Block -->
  <rect y="620" width="600" height="280" fill="#01070a"/>

  <!-- Badges Top -->
  <g transform="translate(30, 40)">
    <rect width="210" height="32" rx="16" fill="rgba(2,132,199,0.3)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="21" fill="#38bdf8" font-family="'Montserrat', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">👑 ₹240 CR ALL-TIME RECORD</text>
  </g>
  <g transform="translate(450, 40)">
    <rect width="120" height="32" rx="16" fill="#0284c7"/>
    <text x="60" y="21" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⭐ 8.7 / 10</text>
  </g>

  <!-- Title Block -->
  <text x="300" y="710" fill="#38bdf8" font-family="'Manjari', 'Anek Malayalam', sans-serif" font-size="50" font-weight="900" text-anchor="middle" filter="url(#torchGlow)" letter-spacing="2">മഞ്ഞുമ്മൽ ബോയ്സ്</text>
  <text x="300" y="750" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="30" font-weight="900" text-anchor="middle" letter-spacing="6">MANJUMMEL BOYS</text>

  <!-- Subtitle & Cast -->
  <text x="300" y="785" fill="#facc15" font-family="'Montserrat', sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="3">A CHIDAMBARAM FILM · SUSHIN SHYAM</text>
  <text x="300" y="812" fill="#94a3b8" font-family="'Montserrat', sans-serif" font-size="14" text-anchor="middle">SOUBIN SHAHIR · SREENATH BHASI · BALU VARGHESE · GANAPATHI</text>

  <!-- Specs -->
  <line x1="60" y1="835" x2="540" y2="835" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  <text x="300" y="865" fill="#64748b" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">U · 2H 15M · REAL-LIFE SURVIVAL THRILLER · MALAYALAM (ENG SUBS)</text>
</svg>